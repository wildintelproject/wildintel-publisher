name: 📦 Release — CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: false
        default: '0.0.0.dev0'

jobs:
  build-linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates:templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-linux-x86_64

      - name: Smoke test
        run: ./dist/wildintel-publisher --help

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: release-assets/*

  build-windows:
    name: Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        shell: bash
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates;templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher.exe \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-windows-x64.exe

      - name: Smoke test
        shell: bash
        run: ./dist/wildintel-publisher.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: release-assets/*

  build-macos:
    name: macOS binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates:templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-macos-arm64

      - name: Smoke test
        run: ./dist/wildintel-publisher --help

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: release-assets/*

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For a tag push, check out `development` (not the tag) so CHANGELOG.md
      # can be promoted and committed straight back to it — mirrors
      # wildintel-trapper-sdk's release.yml. `development` is expected to be
      # what the tag was actually cut from. workflow_dispatch (dev builds)
      # keeps checking out whatever ref triggered it, as before.
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'development' || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve version, date, and previous CLI tag
        id: relver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -vx "${GITHUB_REF_NAME}" | head -n1 || true)
            echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Promote "Upcoming release" (CLI) to a dated, versioned CHANGELOG entry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 .github/scripts/promote_changelog.py \
            --product CLI \
            --version "${{ steps.relver.outputs.version }}" \
            --tag-name "${{ github.ref_name }}" \
            --date "${{ steps.relver.outputs.date }}" \
            --repo "${{ github.repository }}" \
            --prev-tag "${{ steps.relver.outputs.prev_tag }}" \
            --notes-out release_notes.txt

      - name: Commit and push the promoted CHANGELOG.md to development
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: promote Upcoming release (CLI) to ${{ github.ref_name }} in CHANGELOG.md"
          git push origin HEAD:development

      - name: Create stable release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release_notes.txt

      - name: Force-move dev tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f cli-dev
          git push origin cli-dev --force

      - name: Build dev release notes
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "Development build of the \`wildintel-publisher\` CLI — not for production use."
            echo "Built from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`."
            echo ""
            echo "---"
            echo ""
            awk '/^## Upcoming release/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md
          } > dev_release_notes.txt

      - name: Create dev pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-dev
          name: CLI dev build (${{ inputs.version || github.sha }})
          prerelease: true
          make_latest: false
          files: release-assets/*
          body_path: dev_release_notes.txt
