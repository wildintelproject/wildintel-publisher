name: 📦 Release — CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.2.0)'
        required: false
        default: '0.0.0.dev0'

jobs:
  build-linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates:templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-linux-x86_64

      - name: Smoke test
        run: ./dist/wildintel-publisher --help

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: release-assets/*

  build-windows:
    name: Windows binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        shell: bash
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates;templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher.exe \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-windows-x64.exe

      - name: Smoke test
        shell: bash
        run: ./dist/wildintel-publisher.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: release-assets/*

  build-macos:
    name: macOS binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set package version
        run: uv version ${{ steps.ver.outputs.version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build executable
        run: |
          uv run pyinstaller wildintel_publisher/main.py \
            --onefile \
            --name wildintel-publisher \
            --add-data "templates:templates" \
            --copy-metadata wildintel-publisher \
            --collect-all frictionless \
            --collect-all huggingface_hub \
            --collect-all dynaconf \
            --collect-submodules trapper_client \
            --hidden-import typer \
            --hidden-import jinja2 \
            --hidden-import yaml

      - name: Stage artifact
        run: |
          mkdir -p release-assets
          cp dist/wildintel-publisher \
             release-assets/wildintel-publisher-${{ steps.ver.outputs.version }}-macos-arm64

      - name: Smoke test
        run: ./dist/wildintel-publisher --help

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: release-assets/*

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create stable release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

      - name: Force-move dev tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f cli-dev
          git push origin cli-dev --force

      - name: Create dev pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-dev
          name: CLI dev build (${{ inputs.version || github.sha }})
          prerelease: true
          make_latest: false
          files: release-assets/*
          body: |
            Development build of the `wildintel-publisher` CLI — not for production use.
            Built from commit `${{ github.sha }}`.
